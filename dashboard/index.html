<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>agent-loop-meter</title>
<style>
  :root { --bg:#1d1611; --panel:#2a1f17; --ink:#f3e6d3; --soft:#a08c78; --work:#f39a3c; --test:#e8533a; --wait:#6b5a4b; --review:#7f9cc0; --deploy:#9cc36b; --other:#b48ead; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Hiragino Sans",sans-serif; }
  header { display:flex; gap:32px; align-items:baseline; padding:20px 28px; border-bottom:1px solid #3b2a1e; flex-wrap:wrap; }
  h1 { font-size:22px; margin:0; letter-spacing:.02em; }
  .stat b { font-size:28px; color:var(--work); margin-right:6px; }
  .stat { color:var(--soft); }
  main { padding:20px 28px; display:grid; gap:24px; }
  section { background:var(--panel); border-radius:12px; padding:18px 20px; }
  h2 { font-size:15px; margin:0 0 12px; color:var(--soft); font-weight:600; letter-spacing:.04em; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; font-size:13px; color:var(--soft); margin-bottom:10px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .cards { display:flex; gap:12px; flex-wrap:wrap; }
  .card { background:#3b2a1e; border-radius:10px; padding:12px 14px; min-width:220px; }
  .card .who { font-size:13px; color:var(--soft); }
  .card .what { font-size:18px; }
  .card .t { font-variant-numeric:tabular-nums; font-size:26px; color:var(--work); }
  .card.testing .t { color:var(--test); } .card.waiting .t { color:#c4b09a; }
  .lane { display:grid; grid-template-columns:200px 1fr 70px; gap:10px; align-items:center; margin:6px 0; }
  .lane .name { font-size:13px; color:var(--soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar { position:relative; height:18px; background:#211912; border-radius:4px; overflow:hidden; }
  .seg { position:absolute; top:0; bottom:0; }
  .lane .min { font-variant-numeric:tabular-nums; text-align:right; font-size:13px; }
  #before .lane { grid-template-columns:150px 1fr 60px; margin:3px 0; }
  #before .bar { height:12px; }
  .note { color:var(--soft); font-size:13px; margin-top:10px; }
  [hidden] { display:none; }
  .empty { color:var(--soft); font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>agent-loop-meter</h1>
  <span class="stat"><b id="nActive">0</b><span data-i="active"></span></span>
  <span class="stat"><b id="lock">—</b><span data-i="lock"></span></span>
  <span class="stat"><b id="nDone">0</b><span data-i="done"></span></span>
  <span class="stat"><b id="nMerge">0</b><span data-i="merges"></span></span>
</header>
<main>
  <section>
    <h2 data-i="liveH"></h2>
    <div class="cards" id="cards"></div>
  </section>
  <section>
    <h2 data-i="lanesH"></h2>
    <div class="legend"><span><i style="background:var(--work)"></i><span data-i="work"></span></span><span><i style="background:var(--test)"></i><span data-i="test"></span></span><span><i style="background:var(--wait)"></i><span data-i="wait"></span></span></div>
    <div id="lanes"><p class="empty" data-i="waiting"></p></div>
  </section>
  <section>
    <h2 data-i="kindsH"></h2>
    <div class="legend" id="kinds"></div>
  </section>
  <section id="before" hidden>
    <h2 id="beforeH"></h2>
    <div class="legend" id="beforeLegend"></div>
    <div id="beforeLanes"></div>
    <p class="note" id="beforeNote"></p>
  </section>
</main>
<script>
const T = {
  en: { active:"active agents", lock:"lock holder", done:"finished", merges:"merges", liveH:"Agents running now", lanesH:"Agent lanes (minutes)",
    kindsH:"Events by kind", work:"working", test:"testing", wait:"waiting for lock", waiting:"Waiting for events...", none:"No agent is running.",
    state:{work:"working",test:"testing",wait:"waiting for lock",done:"done"}, free:"free",
    beforeH:(n)=>`Before: where ${n} past tasks spent their time`, tasks:"tasks",
    stages:{impl_min:"implementation",test_min:"tests",wait_min:"queueing",review_min:"review",deploy_min:"deploy wait",other_min:"other"},
    note:(m,x)=>`median ${m} min, longest ${x} min.`, other:"other" },
  ja: { active:"動いている担当", lock:"鍵を持つ担当", done:"終わった担当", merges:"マージ", liveH:"いま動いている担当", lanesH:"担当の帯 (分)",
    kindsH:"出来事の種類", work:"実装", test:"テスト", wait:"鍵の順番待ち", waiting:"記録を待っています…", none:"いま動いている担当はいません",
    state:{work:"実装",test:"テスト中",wait:"順番待ち",done:"終わり"}, free:"空き",
    beforeH:(n)=>`「前」: 過去 ${n} 本の時間の内訳`, tasks:"本",
    stages:{impl_min:"実装",test_min:"テスト",wait_min:"順番待ち",review_min:"確認役",deploy_min:"反映待ち",other_min:"その他"},
    note:(m,x)=>`中央値 ${m} 分・最長 ${x} 分。`, other:"その他" },
};
const L = new URLSearchParams(location.search).get("lang") === "ja" ? "ja" : "en";
const t = T[L];
document.documentElement.lang = L;
document.querySelectorAll("[data-i]").forEach(el => el.textContent = t[el.dataset.i]);

const PALETTE = ["#f39a3c","#e8533a","#6b5a4b","#7f9cc0","#9cc36b","#b48ead","#d9c35b","#5bb5a6"];
const KIND_COLOR = { agent_spawn:"#7f9cc0", agent_start:"#7f9cc0", agent_stop:"#6b5a4b", lock_wait:"#6b5a4b", lock_got:"#c4b09a", lock_free:"#c4b09a",
  test_start:"#e8533a", test_end:"#e8533a", merge:"#9cc36b", pr:"#9cc36b", release:"#9cc36b", release_check:"#9cc36b" };
const kindColor = (k) => KIND_COLOR[k] || "#b48ead"; // unknown kinds fall into "other"
const kindCounts = new Map();

const agents = new Map();
let lockHolder = null, merges = 0;
const now = () => Date.now();
const fmt = (ms) => { const s = Math.max(0, Math.round(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };

function agentOf(id) {
  if (!agents.has(id)) agents.set(id, { label: id, start: null, end: null, state: "work", since: null, segs: [] });
  return agents.get(id);
}
function setState(a, state, ts) {
  if (a.state === state) return;
  if (a.since != null) a.segs.push({ kind: a.state, from: a.since, to: ts });
  a.state = state; a.since = ts;
}
function onEvent(e) {
  const ts = Date.parse(e.t);
  if (!(ts > 0)) return;
  kindCounts.set(e.kind, (kindCounts.get(e.kind) || 0) + 1);
  if (e.kind === "merge") merges++;
  if (e.agent === "main" || e.agent === "release") { render(); return; }
  const a = agentOf(e.agent);
  if (a.start == null) { a.start = ts; a.since = ts; }
  if (e.kind === "agent_start" && e.label) a.label = e.label;
  if (e.kind === "lock_wait") setState(a, "wait", ts);
  if (e.kind === "lock_got") { setState(a, "work", ts); lockHolder = a; }
  if (e.kind === "lock_free") { setState(a, "work", ts); if (lockHolder === a) lockHolder = null; }
  if (e.kind === "test_start") setState(a, "test", ts);
  if (e.kind === "test_end" && !e.bg) setState(a, "work", ts);
  if (e.kind === "agent_stop") { setState(a, "done", ts); a.end = ts; if (lockHolder === a) lockHolder = null; }
  render();
}
const color = { work: "var(--work)", test: "var(--test)", wait: "var(--wait)" };
function render() {
  const live = [...agents.values()].filter(a => a.end == null);
  document.getElementById("nActive").textContent = live.length;
  document.getElementById("nDone").textContent = [...agents.values()].filter(a => a.end != null).length;
  document.getElementById("nMerge").textContent = merges;
  document.getElementById("lock").textContent = lockHolder ? lockHolder.label.slice(0, 18) : t.free;
  const cards = document.getElementById("cards");
  cards.innerHTML = live.length ? "" : `<p class="empty">${t.none}</p>`;
  for (const a of live) {
    const d = document.createElement("div");
    d.className = "card " + (a.state === "test" ? "testing" : a.state === "wait" ? "waiting" : "");
    d.innerHTML = '<div class="who"></div><div class="what"></div><div class="t"></div>';
    d.querySelector(".who").textContent = a.label;
    d.querySelector(".what").textContent = t.state[a.state];
    d.querySelector(".t").textContent = fmt(now() - a.start);
    cards.appendChild(d);
  }
  const kinds = document.getElementById("kinds");
  kinds.innerHTML = "";
  for (const [k, n] of [...kindCounts].sort()) {
    const sp = document.createElement("span");
    const i = document.createElement("i"); i.style.background = kindColor(k);
    sp.appendChild(i); sp.append(`${k} ${n}`);
    if (!KIND_COLOR[k]) sp.title = t.other;
    kinds.appendChild(sp);
  }
  const all = [...agents.values()];
  const lanes = document.getElementById("lanes");
  if (!all.length) return;
  lanes.innerHTML = "";
  const t0 = Math.min(...all.map(a => a.start)), t1 = Math.max(now(), ...all.map(a => a.end || 0));
  const span = Math.max(60000, t1 - t0);
  for (const a of all) {
    const row = document.createElement("div"); row.className = "lane";
    const segs = [...a.segs]; if (a.end == null) segs.push({ kind: a.state, from: a.since, to: now() });
    row.innerHTML = '<div class="name"></div><div class="bar"></div><div class="min"></div>';
    row.querySelector(".name").textContent = a.label;
    row.querySelector(".min").textContent = Math.round(((a.end || now()) - a.start) / 60000);
    const bar = row.querySelector(".bar");
    for (const s of segs) {
      if (s.kind === "done") continue;
      const seg = document.createElement("div"); seg.className = "seg";
      seg.style.left = ((s.from - t0) / span * 100) + "%";
      seg.style.width = Math.max(0.2, (s.to - s.from) / span * 100) + "%";
      seg.style.background = color[s.kind] || color.work;
      bar.appendChild(seg);
    }
    lanes.appendChild(row);
  }
}
setInterval(render, 1000);
render();
new EventSource("/events").onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch {} };

// "Before" strip: optional. Reads /before.csv (server --before); hidden if absent.
// Needs a total_min column (or *_min stage columns); stage columns present in the CSV are drawn.
fetch("/before.csv").then(r => r.ok ? r.text() : "").then(txt => {
  if (!txt.trim()) return;
  const [head, ...lines] = txt.trim().split("\n");
  const cols = head.split(",");
  const rows = lines.map(l => Object.fromEntries(l.split(",").map((v, i) => [cols[i], v])));
  const stageCols = ["impl_min","test_min","wait_min","review_min","deploy_min","other_min"].filter(c => cols.includes(c));
  if (!rows.length || !stageCols.length) return;
  const stageColor = { impl_min:"var(--work)", test_min:"var(--test)", wait_min:"var(--wait)", review_min:"var(--review)", deploy_min:"var(--deploy)", other_min:"var(--other)" };
  const total = (r) => +r.total_min || stageCols.reduce((s, c) => s + (+r[c] || 0), 0);
  const max = Math.max(...rows.map(total));
  document.getElementById("beforeH").textContent = t.beforeH(rows.length);
  document.getElementById("beforeLegend").innerHTML = stageCols.map(c => `<span><i style="background:${stageColor[c]}"></i>${t.stages[c]}</span>`).join("");
  const box = document.getElementById("beforeLanes");
  for (const r of rows) {
    const row = document.createElement("div"); row.className = "lane";
    row.innerHTML = '<div class="name"></div><div class="bar"></div><div class="min"></div>';
    row.querySelector(".name").textContent = `#${r.task || ""} ${r.category || ""}`.trim();
    row.querySelector(".min").textContent = Math.round(total(r));
    let x = 0; const bar = row.querySelector(".bar");
    for (const c of stageCols) {
      const w = (+r[c] || 0) / max * 100; if (!w) continue;
      const seg = document.createElement("div"); seg.className = "seg";
      seg.style.left = x + "%"; seg.style.width = w + "%"; seg.style.background = stageColor[c]; bar.appendChild(seg); x += w;
    }
    box.appendChild(row);
  }
  const sorted = rows.map(total).sort((a, b) => a - b);
  document.getElementById("beforeNote").textContent = t.note(Math.round(sorted[Math.floor(sorted.length / 2)]), Math.round(sorted[sorted.length - 1]));
  document.getElementById("before").hidden = false;
});
</script>
</body>
</html>
